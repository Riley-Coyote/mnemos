name: Release hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with MCP surface
        if: matrix.python-version != '3.13'
        run: uv run --extra dev --extra mcp pytest -q

      - name: Enforce supported-code coverage
        if: matrix.python-version == '3.13'
        run: uv run --extra dev --extra mcp pytest -q --cov --cov-report=term

      - name: Reject correctness errors
        if: matrix.python-version == '3.13'
        run: uv run --extra dev ruff check mnemos

      - name: Compile release entrypoints
        run: |
          uv run --extra mcp python -m py_compile \
            mnemos/simple_runtime.py \
            mnemos/simple_mcp.py \
            mnemos/mcp_server.py \
            mnemos/cli.py

      - name: Build package
        run: uv build

      - name: Check wheel contents
        run: |
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path

          # Glob the project prefix, not the full distribution name, so a
          # rename cannot silently break this check with a StopIteration.
          wheel = next(Path("dist").glob("mnemos*.whl"))
          # Keep this set identical to the one in release.yml — a packaging
          # regression must not pass one gate and fail the other.
          required = {
              "mnemos/simple_runtime.py",
              "mnemos/simple_mcp.py",
              "mnemos/setup/scheduler.py",
              "templates/SOUL.md",
              "templates/IDENTITY.md",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing from wheel: {missing}")
          print(f"Wheel OK: {wheel}")
          PY

      - name: Smoke-install the wheel with an unlocked resolver
        run: |
          # Everything above runs against uv.lock, so a broken *declared*
          # dependency range passes every check while a real `pip install`
          # fails. This installs the built wheel into a clean venv with no
          # lockfile, resolving dependencies live from PyPI exactly as a user
          # would — the only step that can catch "green CI, dead install".
          python -m venv /tmp/mnemos-smoke
          /tmp/mnemos-smoke/bin/pip install --quiet --upgrade pip
          /tmp/mnemos-smoke/bin/pip install --quiet dist/*.whl
          /tmp/mnemos-smoke/bin/python - <<'PY'
          import asyncio
          import importlib.metadata as md

          # Importing constructs the FastMCP server and registers every simple
          # tool at module scope. Under mcp 2.0 this line raised
          # ModuleNotFoundError: No module named 'mcp.server.fastmcp'.
          from mnemos.simple_mcp import SIMPLE_TOOL_NAMES, simple_mcp

          print("resolved mcp:", md.version("mcp"))
          tools = {t.name for t in asyncio.run(simple_mcp.list_tools())}
          if tools != set(SIMPLE_TOOL_NAMES):
              raise SystemExit(
                  f"tool surface mismatch: {sorted(tools)} != "
                  f"{sorted(SIMPLE_TOOL_NAMES)}"
              )
          print(f"Fresh install OK: {len(tools)} simple tools registered")
          PY

      - name: Check package metadata
        run: uvx twine check dist/*

  security:
    name: Dependency and code security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --output-file /tmp/mnemos-runtime.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/mnemos-runtime.txt

      - name: Reject high-severity code findings
        run: |
          uvx bandit -q -lll \
            mnemos/simple_runtime.py \
            mnemos/simple_mcp.py \
            mnemos/simple_scope.py \
            mnemos/backup.py \
            mnemos/file_security.py \
            mnemos/store/sqlite_store.py \
            mnemos/setup/scheduler.py \
            mnemos/cli.py \
            mnemos/llm.py \
            mnemos/integrations/hermes/*.py

  platform-blackbox:
    name: Black box (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build release wheel
        run: uv build

      - name: Audit installed wheel on macOS or Linux
        if: runner.os != 'Windows'
        run: |
          uv venv .audit-venv --python 3.12
          uv pip install --python .audit-venv/bin/python dist/*.whl
          .audit-venv/bin/python scripts/release_blackbox.py \
            --mnemos .audit-venv/bin/mnemos

      - name: Audit installed wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv venv .audit-venv --python 3.12
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --python .audit-venv/Scripts/python.exe $wheel
          .audit-venv/Scripts/python.exe scripts/release_blackbox.py `
            --mnemos .audit-venv/Scripts/mnemos.exe
