    - paragraph [ref=e245]: "In cognitive science, the “new theory of disuse” distinguishes between storage strength and retrieval strength. Mnemos extends this to three independent dimensions:"
    - paragraph [ref=e246]:
      - strong [ref=e247]: Strength
      - text: models encoding depth—increases with retrieval, decays logarithmically without use.
      - strong [ref=e248]: Stability
      - text: models resistance to forgetting—builds through spaced retrieval, connection density, and surprise, resisting decay
      - emphasis [ref=e249]: exponentially
      - text: .
      - strong [ref=e250]: Accessibility
      - text: models how retrievable a memory is right now, fluctuating with recency and emotional state.
    - paragraph [ref=e251]:
      - text: A memory can be
      - strong [ref=e252]: strong but inaccessible
      - text: —deeply encoded but dormant. Or
      - strong [ref=e253]: accessible but unstable
      - text: —recently seen but easily forgotten. Modeling them independently lets Mnemos handle both.
    - heading "Confidence Scoring" [level=3] [ref=e254]
    - paragraph [ref=e255]: Every memory knows how much to trust itself. Confidence ranges from speculative (below 0.4) through model-inferred (0.4–0.7) and user-implied (0.7–0.95) to user-explicit (above 0.95). The system never treats inference as fact.
