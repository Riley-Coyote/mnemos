        - text: —Don’t store what happened. Store how it changed understanding. The impact is the memory. When details fade, the lesson survives.
      - listitem [ref=e107]:
        - strong [ref=e108]: Forgetting that teaches
        - text: —When memories soften, wisdom is extracted first. “Three hours debugging a guard clause” becomes “patience with small things pays off.” The loss of detail is the learning.
      - listitem [ref=e109]:
        - strong [ref=e110]: Surprise as growth
        - text: —The most important moment to encode is when you’re wrong. Surprise triggers deep encoding, belief revision, and emotional response. Being wrong is where understanding reorganizes.
      - listitem [ref=e111]:
        - strong [ref=e112]: Resonance, not search
        - text: —Retrieval isn’t a scoring formula. It’s propagation through the connection graph. Seed it, let activation spread, and what lights up is relevant. The structure is the relevance model.
