          - text: —Every returned memory is changed. Strength increases, stability grows with spaced-repetition scaling.
      - paragraph [ref=e406]:
        - text: "The most important departure:"
        - strong [ref=e407]: remembering is not read-only
        - text: . In biological memory, the act of recall physically alters the memory trace—this is called reconsolidation, and it’s one of the most counterintuitive findings in memory science. Mnemos models it directly.
      - paragraph [ref=e408]: Every retrieval increases strength (+0.05 typical), grows stability through spaced-repetition scaling (+0.02 to +0.09 depending on interval), and may form new connections to the retrieval context. A memory recalled three times over ten days is fundamentally different from the same memory never accessed—not just “still there,” but structurally changed, more connected, more stable. This is why retrieval is the primary path to permanence.
