[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos-continuity"
version = "0.2.1"
description = "Local-first continuity memory for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Riley Ralmuto", email = "r.ralmuto@gmail.com" },
]
keywords = ["ai", "agents", "memory", "mcp", "continuity", "cognitive-architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # mcp is core: the MCP server is the primary product, and it is imported
    # at module scope. Shipping it as an optional extra made a clean install
    # yield a dead `mnemos serve` with the failure hidden on stderr.
    # Upper-bounded on purpose: mcp 2.0 removed `mcp.server.fastmcp`, which
    # every server entrypoint imports, so an unbounded range makes a fresh
    # `pip install` resolve 2.x and produce a server that dies on import. CI
    # never caught it because the lockfile pinned an old 1.x; the wheel smoke
    # job in release-hardening.yml now installs unlocked to close that gap.
    "mcp[cli]>=1.0.0,<2",
    "ulid-py>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Kept as a no-op for backwards-compatible install commands; mcp is now core.
mcp = []

# Local semantic recall, no API key and nothing leaves the machine. Costs
# roughly 700 MB once torch is resolved, which is why it is not core: on a
# real store it changed ~8% of retrieval results, and the continuity path
# does not use embeddings at all. `mnemos doctor` always states which
# retrieval this install actually has.
embeddings = ["sentence-transformers>=2.2.0"]

# Hosted embeddings instead of local ones. Requires GEMINI_API_KEY.
gemini = ["google-generativeai>=0.5.0"]

anthropic = ["anthropic>=0.25.0"]
all = [
    "sentence-transformers>=2.2.0",
    "google-generativeai>=0.5.0",
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[tool.coverage.run]
branch = true
source = [
    "mnemos.simple_runtime",
    "mnemos.simple_mcp",
    "mnemos.simple_scope",
    "mnemos.backup",
    "mnemos.file_security",
    "mnemos.store.sqlite_store",
    "mnemos.setup.scheduler",
]

[tool.coverage.report]
fail_under = 80
skip_covered = true

[tool.ruff.lint]
# Start with correctness failures that can ship broken code. Broader style
# cleanup remains separate from the release gate so it cannot hide real risk
# in hundreds of legacy formatting changes.
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
mnemos = "mnemos.cli:main"
mnemos-index-session = "mnemos.indexer.claude_code_adapter:main"

[project.urls]
Homepage = "https://github.com/Riley-Coyote/mnemos"
Repository = "https://github.com/Riley-Coyote/mnemos"
Issues = "https://github.com/Riley-Coyote/mnemos/issues"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
