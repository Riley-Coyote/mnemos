name: Release hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with MCP surface
        run: uv run --extra dev --extra mcp pytest -q

      - name: Compile release entrypoints
        run: |
          uv run --extra mcp python -m py_compile \
            mnemos/simple_runtime.py \
            mnemos/simple_mcp.py \
            mnemos/mcp_server.py \
            mnemos/cli.py

      - name: Build package
        run: uv build

      - name: Check wheel contents
        run: |
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path

          # Glob the project prefix, not the full distribution name, so a
          # rename cannot silently break this check with a StopIteration.
          wheel = next(Path("dist").glob("mnemos*.whl"))
          required = {
              "mnemos/simple_runtime.py",
              "mnemos/simple_mcp.py",
              "templates/SOUL.md",
              "templates/IDENTITY.md",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing from wheel: {missing}")
          print(f"Wheel OK: {wheel}")
          PY

      - name: Smoke-install the wheel with an unlocked resolver
        run: |
          # Everything above runs against uv.lock, so a broken *declared*
          # dependency range passes every check while a real `pip install`
          # fails. This installs the built wheel into a clean venv with no
          # lockfile, resolving dependencies live from PyPI exactly as a user
          # would — the only step that can catch "green CI, dead install".
          python -m venv /tmp/mnemos-smoke
          /tmp/mnemos-smoke/bin/pip install --quiet --upgrade pip
          /tmp/mnemos-smoke/bin/pip install --quiet dist/*.whl
          /tmp/mnemos-smoke/bin/python - <<'PY'
          import asyncio
          import importlib.metadata as md

          # Importing constructs the FastMCP server and registers every simple
          # tool at module scope. Under mcp 2.0 this line raised
          # ModuleNotFoundError: No module named 'mcp.server.fastmcp'.
          from mnemos.simple_mcp import SIMPLE_TOOL_NAMES, simple_mcp

          print("resolved mcp:", md.version("mcp"))
          tools = {t.name for t in asyncio.run(simple_mcp.list_tools())}
          if tools != set(SIMPLE_TOOL_NAMES):
              raise SystemExit(
                  f"tool surface mismatch: {sorted(tools)} != "
                  f"{sorted(SIMPLE_TOOL_NAMES)}"
              )
          print(f"Fresh install OK: {len(tools)} simple tools registered")
          PY

      - name: Check package metadata
        run: uvx twine check dist/*
