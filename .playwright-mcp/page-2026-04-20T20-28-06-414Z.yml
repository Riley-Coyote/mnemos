      - heading "How Retrieval Works" [level=3] [ref=e359]
      - paragraph [ref=e360]: "In biological memory, recalling one experience triggers related ones through neural association. Mnemos does the same through spreading activation:"
      - list [ref=e361]:
        - listitem [ref=e362]:
          - strong [ref=e363]: Seed
          - text: —Full-text search and embedding similarity find entry points into the graph.
        - listitem [ref=e364]:
          - strong [ref=e365]: Propagate
          - text: —Activation spreads through typed connections for 3 hops. “Supports” edges carry more activation than “parallels.”
        - listitem [ref=e366]:
          - strong [ref=e367]: Emotional Bias
          - text: —Current emotional state applies a multiplicative boost to memories with matching signatures.
        - listitem [ref=e368]:
          - strong [ref=e369]: Threshold
          - text: —Everything above the activation threshold is returned, sorted by final score.
        - listitem [ref=e370]:
          - strong [ref=e371]: Reconsolidate
          - text: —Every returned memory is changed. Strength increases, stability grows with spaced-repetition scaling.
      - paragraph [ref=e372]:
        - text: "The most important departure:"
        - strong [ref=e373]: remembering is not read-only
        - text: . In biological memory, the act of recall physically alters the memory trace—this is called reconsolidation, and it’s one of the most counterintuitive findings in memory science. Mnemos models it directly.
      - paragraph [ref=e374]: Every retrieval increases strength (+0.05 typical), grows stability through spaced-repetition scaling (+0.02 to +0.09 depending on interval), and may form new connections to the retrieval context. A memory recalled three times over ten days is fundamentally different from the same memory never accessed—not just “still there,” but structurally changed, more connected, more stable. This is why retrieval is the primary path to permanence.
