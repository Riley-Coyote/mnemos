        - text: follows connection chains during silence, exploring the graph without a specific query, sometimes surfacing forgotten memories.
        - strong [ref=e526]: Surprise
        - text: fires when contradictions surface during consolidation, triggering curiosity pursuit and deeper investigation.
      - paragraph [ref=e527]:
        - strong [ref=e528]: Reflection
        - text: examines challenged beliefs in depth, weighing evidence from multiple engrams.
        - strong [ref=e529]: Insight
        - text: discovers connections between previously unlinked memories—the “aha” moment when two distant regions of the graph suddenly connect.
        - strong [ref=e530]: Initiation
        - text: fires when salience accumulates above a threshold, prompting the agent to reach out to the user without being asked.
      - paragraph [ref=e531]: Five cognitive modulators—arousal, resolution, openness, selection, and social drive—control the intensity of each handler. High openness means wider, more creative dreaming. High selection means only the most salient events fire handlers. These modulators are the bridge between the emotional state and the cognitive processing—they translate feeling into thinking.
      - heading "Metamemory" [level=3] [ref=e532]
      - paragraph [ref=e533]:
        - text: "Most agents answer every question with equal confidence. An agent with metamemory can say:"
        - emphasis [ref=e534]: I’m strong here. I’m thin there. My memories about that are low confidence.
      - paragraph [ref=e535]: Metamemory is computed from the graph. Domain coverage comes from engram density, confidence averages, lesson counts, and belief presence. An external observer—a separate model—periodically audits the memory for unsupported beliefs, blind spots, and miscalibrated confidence. Findings become memories the agent can process. The system knows what it knows, and knows what it doesn’t.
